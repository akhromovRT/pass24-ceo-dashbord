[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ceo24-backend"
version = "0.1.0"
description = "CEO24 management analytics backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "sqlmodel>=0.0.22",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "python-jose[cryptography]>=3.3",
    "bcrypt>=4.2",
    "python-multipart>=0.0.18",
    "openpyxl>=3.1",
    "xlrd>=2.0",
    "pydantic-settings>=2.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    "ruff>=0.9",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
# E402 — у нас местами импорты идут после module-level констант (например
# OrgStatus-сетов в billing.py), это сделано для читаемости.
# E712 — SQLAlchemy filter pattern `Column == True` нельзя заменить на
# `Column is True` без поломки SQL-перевода; глобальный ignore проще, чем
# расставлять `# noqa: E712` по всему коду.
ignore = ["E402", "E712"]

[tool.ruff.lint.per-file-ignores]
# В тестах E501 (длинная строка) допустим — там часто реальные «назначения
# платежей» из 1С с длинными UPPER-литералами, которые рвать не имеет смысла.
"tests/*" = ["E501"]
# Скрипты разовых операций (dedupe, backfill, miграционные правки) — там
# длинные SQL-литералы и логи, не критично.
"scripts/*" = ["E501"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
