server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # gzip — сжатие статики (~3x). Критично: внешний канал VPS обрывает
    # крупные несжатые HTTP-ответы; сжатые ассеты проходят надёжно.
    gzip on;
    gzip_types application/javascript text/css application/json image/svg+xml application/font-woff2;
    gzip_min_length 1024;
    gzip_comp_level 5;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 20M;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
