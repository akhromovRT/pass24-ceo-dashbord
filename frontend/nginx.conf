# HTTP — ACME-проверка Let's Encrypt + редирект на HTTPS
server {
    listen 80;
    server_name ceo.pass24pro.ru;

    # webroot для выпуска/продления сертификата Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # healthcheck контейнера — без редиректа, IPv4 (см. docker-compose.yml)
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS — приложение
server {
    listen 443 ssl;
    http2 on;
    server_name ceo.pass24pro.ru;
    root /usr/share/nginx/html;
    index index.html;

    ssl_certificate     /etc/letsencrypt/live/ceo.pass24pro.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ceo.pass24pro.ru/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # HSTS — браузер запоминает, что сайт доступен только по HTTPS
    add_header Strict-Transport-Security "max-age=31536000" always;

    # gzip — сжатие статики (~3x) и проксируемых JSON-ответов от backend.
    # Критично:
    # - gzip_proxied any: без него nginx по умолчанию НЕ сжимает ответы
    #   проксируемые через proxy_pass (был фактический корень минутного
    #   ожидания /debt-snapshots/latest без VPN на мобильных сетях, см. P3.0.1).
    # - gzip_vary on: корректно для CDN/прокси-кэшей (добавляет Vary: Accept-Encoding).
    # - gzip_http_version 1.1: явно, т.к. некоторые proxy ходят 1.0.
    gzip on;
    gzip_types application/javascript application/json text/css image/svg+xml application/font-woff2 text/plain;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_proxied any;
    gzip_vary on;
    gzip_http_version 1.1;
    gzip_buffers 16 8k;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 20M;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
