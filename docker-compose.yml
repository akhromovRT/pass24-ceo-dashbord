services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ceo24
      POSTGRES_PASSWORD: ceo24
      POSTGRES_DB: ceo24
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ceo24"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://ceo24:ceo24@db:5432/ceo24
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
