services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ceo24
      POSTGRES_PASSWORD: ceo24
      POSTGRES_DB: ceo24
    ports:
      - "5432:5432"
    volumes:
      - /srv/ceo24/pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ceo24"]
      interval: 10s
      timeout: 3s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    build: ./backend
    restart: unless-stopped
    expose:
      - "8000"
    environment:
      DATABASE_URL: postgresql+psycopg://ceo24:ceo24@db:5432/ceo24
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health',timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
    volumes:
      # TLS-сертификаты Let's Encrypt (выпуск/продление — см. agent_docs/guides/runbook.md)
      - /srv/ceo24/certbot/conf:/etc/letsencrypt:ro
      - /srv/ceo24/certbot/www:/var/www/certbot:ro
    healthcheck:
      # 127.0.0.1, не localhost: localhost резолвится в IPv6 ::1, nginx слушает только IPv4
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
